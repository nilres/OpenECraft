[package]
name = "openecraft-core"
version.workspace = true
edition = "2021"
description = "Headless project model of OpenECraft (pages, devices, checks, reports, SVG / PDF / DXF / DWG export)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
openecraft-parts = { path = "../openecraft-parts" }
openecraft-i18n = { path = "../openecraft-i18n" }
openecraft-fonts = { path = "../openecraft-fonts" }
openecraft-jt = { path = "../openecraft-jt" }
openecraft-xt = { path = "../openecraft-xt" }
miniz_oxide = "0.8"
png = "0.18"
# The Ubuntu font of egui (bytes only), embedded in PDF files for text beyond WinAnsi.
epaint_default_fonts = "0.37"
acadrust = { version = "0.6.6", default-features = false }
