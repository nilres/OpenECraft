[package]
name = "openecraft-shell"
version.workspace = true
edition = "2021"
description = "The shell of the OpenECraft editor as tables: commands, ribbon, panes, workspaces, keys, mouse gestures and state colours, shared by the editor and the website"
license = "MIT OR Apache-2.0"

[dependencies]
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Docking panels (src/dock.rs).
egui_tiles = { version = "0.18", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
openecraft-i18n = { path = "../openecraft-i18n" }
openecraft-ui = { path = "../openecraft-ui" }
