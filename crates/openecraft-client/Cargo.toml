[package]
name = "openecraft-client"
version.workspace = true
edition = "2021"
description = "Requests to the OpenECraft parts and project servers and the decoding of its answers (shared by the applications and the command line)"
license = "MIT OR Apache-2.0"

[dependencies]
ehttp = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
openecraft-parts = { path = "../openecraft-parts" }
openecraft-core = { path = "../openecraft-core" }
openecraft-i18n = { path = "../openecraft-i18n" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
zeroize = "1"
