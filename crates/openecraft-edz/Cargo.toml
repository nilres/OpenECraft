[package]
name = "openecraft-edz"
version.workspace = true
edition = "2021"
description = "EDZ import of OpenECraft: parts, connection points, drilling patterns, pictures and macros of EPLAN Data Portal archives, and enclosure packages of configurators"
license = "MIT OR Apache-2.0"

[dependencies]
openecraft-core = { path = "../openecraft-core" }
openecraft-i18n = { path = "../openecraft-i18n" }
serde_json = "1"
openecraft-parts = { path = "../openecraft-parts" }
sevenz-rust2 = { version = "0.24", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
openecraft-step = { path = "../openecraft-step" }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
