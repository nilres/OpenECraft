[package]
name = "openecraft-edz"
version.workspace = true
edition = "2021"
description = "EDZ import of OpenECraft: parts, connection points, drilling patterns, pictures and macros of EPLAN Data Portal archives"
license = "MIT OR Apache-2.0"

[dependencies]
openecraft-core = { path = "../openecraft-core" }
serde_json = "1"
openecraft-parts = { path = "../openecraft-parts" }
sevenz-rust2 = { version = "0.24", default-features = false }

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
