[package]
name = "openecraft-parts"
version.workspace = true
edition = "2021"
description = "Shared parts model of OpenECraft (part data, function templates, CSV/JSON, parts server API)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# Keep native coordinates byte-for-byte stable when variant payloads pass through
# catalog JSON, SQLite model storage, and the project file.
serde_json = { version = "1", features = ["float_roundtrip"] }
