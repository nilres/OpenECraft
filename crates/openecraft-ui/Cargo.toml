[package]
name = "openecraft-ui"
version.workspace = true
edition = "2021"
description = "Shared egui components of OpenECraft (part editor, model previews, parts server client, file dialogs)"
license = "MIT OR Apache-2.0"

[dependencies]
# Bundle the symbol / emoji fonts: native builds have no browser font fallback.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
log = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openecraft-client = { path = "../openecraft-client" }
openecraft-parts = { path = "../openecraft-parts" }
openecraft-step = { path = "../openecraft-step" }
openecraft-jt = { path = "../openecraft-jt" }
openecraft-i18n = { path = "../openecraft-i18n" }
openecraft-fonts = { path = "../openecraft-fonts" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url",
    "DomStringList", "Event", "EventTarget", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
    "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent",
] }
