<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenECraft project server</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web.css">
<style>
main { padding: 16px; max-width: 1700px; margin: 0 auto; }
#filter { flex: 1 1 260px; max-width: 420px; }
.rights { display: flex; flex-wrap: wrap; gap: 4px; }
.rights .badge { color: var(--muted); }
.badge.locked { color: var(--warn); }
.badge.readonly { color: var(--accent); }
.project .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 10px; }
.project .head h2 { margin: 0; font-size: 22px; }
.project .info { margin: 0 0 12px; }
.viewer { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; min-height: 70vh; }
.nav { border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow: auto; max-height: 82vh; }
.nav .tabs { margin-bottom: 8px; padding-bottom: 6px; }
.nav details { margin: 2px 0 2px 4px; }
.nav details details { margin-left: 12px; }
.nav summary { cursor: pointer; font-weight: 600; padding: 2px 4px; border-radius: 4px; }
.nav summary:hover { background: var(--chip); }
.nav .row { display: flex; gap: 6px; padding: 2px 6px; border-radius: 4px; color: var(--text); text-decoration: none; }
.nav .row:hover { background: var(--chip); text-decoration: none; }
.nav .row.sel { background: var(--chip); font-weight: 600; }
.nav .row .desc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .row .lock { margin-left: auto; color: var(--warn); white-space: nowrap; font-size: 13px; }
.nav .places { list-style: none; margin: 2px 0 6px 14px; padding: 0; font-size: 13px; }
.nav .group { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 4px 4px; }
.nav input[type=search] { width: 100%; margin-bottom: 8px; }
.sheet { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-width: 0; }
.sheet .toolbar { padding: 8px 10px; margin: 0; border-bottom: 1px solid var(--line); }
.sheet .title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.paper { flex: 1; overflow: auto; background: #8a8f98; padding: 12px; cursor: grab; max-height: 78vh; touch-action: none; }
.paper.dragging { cursor: grabbing; }
.paper img { display: block; margin: 0 auto; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.35); user-select: none; -webkit-user-drag: none; }
.paper .status { color: #fff; }
.modes { margin-bottom: 10px; padding-bottom: 6px; }
.inspection .summary { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.inspection .filter { display: flex; gap: 8px; align-items: center; flex: 1 1 260px; max-width: 460px; }
.inspection .filter input { flex: 1; min-width: 0; }
.badge.passed { color: var(--ok); }
.badge.failed { color: var(--bad); }
.badge.incomplete { color: var(--warn); }
.badge.not_tested { color: var(--muted); }
.missing { color: var(--warn); font-weight: 600; }
.circuit { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; background: var(--panel); }
.circuit > summary { display: flex; gap: 8px; align-items: center; padding: 10px 12px; min-height: 48px; cursor: pointer; list-style: none; }
.circuit > summary::-webkit-details-marker { display: none; }
.circuit > summary::before { content: "▸"; color: var(--muted); }
.circuit[open] > summary::before { content: "▾"; }
.circuit > summary .desc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.circuit[open] > summary { border-bottom: 1px solid var(--line); }
.circuit .body { padding: 10px 12px 12px; }
.measure { border: 0; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.measure label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.measure .limit { white-space: nowrap; }
.measure input, .measure select, .measure textarea { width: 100%; font-size: 16px; padding: 10px; min-height: 44px; }
.measure .wide { grid-column: 1 / -1; }
.measure .bad input, .measure .bad select { border-color: var(--bad); outline: 1px solid var(--bad); }
.measure .bad > span { color: var(--bad); }
.circuit .buttons button { min-height: 44px; padding: 8px 18px; }
.circuit.report { border-color: var(--accent); margin-bottom: 14px; }
.inspection .group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 2px 8px; }
.measure h4 { margin: 8px 0 0; font-size: 14px; color: var(--text); border-top: 1px solid var(--line); padding-top: 10px; }
.measure .check-item { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 160px; align-items: center; gap: 4px 12px; color: var(--text); font-size: 14px; }
@media (max-width: 800px) {
  main { padding: 12px 16px; }
  .viewer { grid-template-columns: 1fr; }
  .nav { max-height: 40vh; }
  .project .info { display: none; }
  .measure { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 480px) {
  header { position: static; }
  main { padding: 8px; }
  section.panel { padding: 8px; }
  .measure { grid-template-columns: 1fr; }
  .measure .check-item { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-title="OpenECraft project server">
<header>
  <h1><a href="#" id="home"><img src="/logo.svg" alt=""><span data-t="OpenECraft project server">OpenECraft project server</span></a></h1>
  <nav>
    <button id="nav-projects" class="active" data-t="Projects">Projects</button>
    <button id="nav-admin" data-t="Administration" hidden>Administration</button>
    <select id="lang" aria-label="Language"></select>
  </nav>
  <div id="account"></div>
</header>
<main>
  <section class="panel" id="content"><div class="status" data-t="Loading…">Loading…</div></section>
</main>
<footer><div id="footer"></div><div id="legal"></div></footer>
<script src="/common.js"></script>
<script src="/access.js"></script>
<script src="/admin.js"></script>
<script src="/inspection.js"></script>
<script src="/project.js"></script>
</body>
</html>
