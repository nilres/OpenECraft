# Configuration of the OpenECraft project server:
#   openecraft-project-server --config project-server.toml
# or OPENECRAFT_PROJECT_SERVER_CONFIG=project-server.toml. Every setting is optional and
# has the name of its command line option (`admin_user` for `--admin-user`); options on
# the command line or in the environment win. Relative paths are relative to this file.

# Address to listen on.
bind = "0.0.0.0:8091"

# Directory of the project files; created if missing.
data = "projects"

# Access token required for every request. Better kept out of this file:
# OPENECRAFT_PROJECT_TOKEN.
# token = "change-me"

# Administrator account created (or reset) at startup (or OPENECRAFT_PROJECT_ADMIN_USER);
# its password is read from OPENECRAFT_PROJECT_ADMIN_PASSWORD.
# admin_user = "admin"

# Access settings (directories, roles, grants). Default: access.json in the data
# directory.
# access = "projects/access.json"

# Serve the web page (or --web, OPENECRAFT_PROJECT_WEB=true): the projects read only
# and the administration of users, access rights and directories. Off by default.
# web = true

# The legal notice of who runs the server, shown by the web page (in Germany the
# Impressum): a link "Legal notice" below the page when a name is set. Lines of the
# address and of the texts are separated by "|". Each field is also set by a variable:
# OPENECRAFT_LEGAL_NAME, _ADDRESS, _EMAIL, _PHONE, _REPRESENTATIVE, _REGISTER, _VAT_ID,
# _RESPONSIBLE, _TEXT, _PRIVACY (a variable wins over this file).
# [legal]
# name = "ACME Automation GmbH"
# address = "Example Street 1 | 12345 Example City | Germany"
# email = "info@example.com"
# phone = "+49 123 456789"
# representative = "Jane Doe"
# register = "Amtsgericht Example, HRB 12345"
# vat = "DE123456789"
# responsible = "Jane Doe, address as above"
# Further text: disclaimers, dispute resolution.
# text = "We are not obliged to take part in dispute resolution proceedings."
# Added to the privacy notice of the page: the hosting, the logs, whom to ask.
# privacy = "Hosted by Example Hosting GmbH. | Questions: privacy@example.com"
