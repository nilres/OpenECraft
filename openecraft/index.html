<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- What a search engine and a link preview show of the page: the editor itself is
         drawn on a canvas (it names the open project in the title once it runs). The
         tags that need the public address of the editor go between the two markers
         (OPENECRAFT_SITE_URL of the Docker image, docs/installation.md). -->
    <title>OpenECraft web editor – electrical CAE in the browser</title>
    <meta name="description" content="The OpenECraft web editor: draw schematics, write reports and lay out the panel in 3D in the browser. Free and open source, nothing to install, projects stay on your computer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenECraft" />
    <meta property="og:title" content="OpenECraft web editor – electrical CAE in the browser" />
    <meta property="og:description" content="The OpenECraft web editor: draw schematics, write reports and lay out the panel in 3D in the browser. Free and open source, nothing to install, projects stay on your computer." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- site address (installer/docker/website-site.sh) -->
    <!-- /site address -->
    <link data-trunk rel="rust" data-bin="openecraft" data-cargo-profile-release="web" data-wasm-opt="2" data-initializer="loading.js" />
    <link data-trunk rel="copy-file" href="../assets/icon.svg" />
    <link data-trunk rel="copy-file" href="worker.js" />
    <link data-trunk rel="copy-file" href="robots.txt" />
    <link data-trunk rel="copy-file" href="../website/social.jpg" />
    <link data-trunk rel="copy-file" href="../website/favicon.ico" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- The legal notice of who runs this web editor (config.js, docs/installation.md). -->
    <link data-trunk rel="copy-file" href="config.js" />
    <script src="config.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1b1c1f; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                   color: #ddd; font-family: sans-serif; font-size: 18px; text-align: center; }
        #loading-track { width: min(320px, 70vw); height: 6px; margin: 14px auto 8px; border-radius: 3px;
                         background: #33353a; overflow: hidden; }
        #loading-bar { width: 0; height: 100%; background: #4a9eff; transition: width 0.15s linear; }
        #loading-amount { font-size: 13px; color: #999; min-height: 16px; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <canvas id="openecraft_canvas"></canvas>
    <div id="loading">
        Loading OpenECraft…
        <!-- The progress of the download (loading.js). -->
        <div id="loading-track"><div id="loading-bar"></div></div>
        <div id="loading-amount"></div>
    </div>
</body>
</html>
