[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080

# License files next to the page (installer/web/licenses.sh).
[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = ["../installer/web/licenses.sh"]

[hooks.windows]
command = "powershell"
command_arguments = ["-ExecutionPolicy", "Bypass", "-File", "..\\installer\\web\\licenses.ps1"]

# The catalogs of the further languages beside the page (i18n/): it is built without
# them and fetches the one of the language in use.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--release", "-p", "openecraft-i18n", "--example", "catalogs"]

# The 3D routings of the examples beside the page (routing/): the worker of the page
# (worker.js) takes the one of an example opened unchanged instead of searching it,
# which takes seconds for a big one. Release builds only.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--release", "-p", "openecraft-core", "--example", "routings"]
