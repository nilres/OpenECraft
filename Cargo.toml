[workspace]
members = ["openecraft", "crates/openecraft-i18n", "crates/openecraft-fonts", "crates/openecraft-core", "crates/openecraft-client", "crates/openecraft-step", "crates/openecraft-edz", "crates/openecraft-scan", "crates/openecraft-jt", "crates/openecraft-xt", "crates/openecraft-parts", "crates/openecraft-ui", "crates/openecraft-api", "crates/openecraft-auth", "crates/openecraft-view", "crates/openecraft-web", "crates/openecraft-shell", "crates/openecraft-session", "crates/openecraft-canvas", "crates/openecraft-site", "parts-server", "project-server", "parts-manager", "cli", "website"]
exclude = ["vendor"]
resolver = "2"

# The version of every crate and of the installers (installer/*/build.*).
[workspace.package]
version = "0.1.2"

[profile.release]
opt-level = 2

# The release builds for the browser (`data-cargo-profile-release` in the index.html
# of the editor, the parts manager and the website): optimised for size, as a page is
# the download of its WebAssembly. The editor: 32 MB instead of 51 MB, and a routing
# search 7 % slower. The desktop builds keep `release`.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
