[workspace]
members = ["openecraft", "crates/openecraft-i18n", "crates/openecraft-fonts", "crates/openecraft-core", "crates/openecraft-client", "crates/openecraft-step", "crates/openecraft-edz", "crates/openecraft-jt", "crates/openecraft-xt", "crates/openecraft-parts", "crates/openecraft-ui", "crates/openecraft-api", "crates/openecraft-auth", "parts-server", "project-server", "parts-manager", "cli"]
exclude = ["vendor"]
resolver = "2"

# The version of every crate and of the installers (installer/*/build.*).
[workspace.package]
version = "0.1.1"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
