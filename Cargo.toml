[workspace]
members = ["openecraft", "crates/openecraft-i18n", "crates/openecraft-fonts", "crates/openecraft-core", "crates/openecraft-client", "crates/openecraft-step", "crates/openecraft-edz", "crates/openecraft-jt", "crates/openecraft-xt", "crates/openecraft-parts", "crates/openecraft-ui", "crates/openecraft-api", "crates/openecraft-auth", "crates/openecraft-view", "crates/openecraft-web", "crates/openecraft-shell", "crates/openecraft-session", "crates/openecraft-canvas", "parts-server", "project-server", "parts-manager", "cli", "website"]
exclude = ["vendor"]
resolver = "2"

# The version of every crate and of the installers (installer/*/build.*).
[workspace.package]
version = "0.1.2"

[profile.release]
opt-level = 2

# The release build of the web editor (`data-cargo-profile-release` in
# openecraft/index.html): optimised for size, as the page is the download of its
# WebAssembly. 32 MB instead of 51 MB, and a routing search 7 % slower.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
