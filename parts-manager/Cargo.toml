[package]
name = "openecraft-parts-manager"
version.workspace = true
edition = "2021"
description = "OpenECraft parts manager - maintains the parts of an OpenECraft parts server"
license = "MIT OR Apache-2.0"

[[bin]]
name = "openecraft-parts-manager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde_json = "1"
log = "0.4"
openecraft-edz = { path = "../crates/openecraft-edz" }
openecraft-step = { path = "../crates/openecraft-step" }
openecraft-parts = { path = "../crates/openecraft-parts" }
openecraft-i18n = { path = "../crates/openecraft-i18n" }
openecraft-ui = { path = "../crates/openecraft-ui" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }

[dev-dependencies]
openecraft-core = { path = "../crates/openecraft-core" }
