# nginx site of the web editor in its Docker image (installer/docker/Dockerfile, target
# editor-web). trunk names the scripts and the WebAssembly after their hash, so they are
# cached for long; index.html is checked at every visit to find a new build.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types application/wasm application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri =404;
    }
}
