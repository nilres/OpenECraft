# nginx site of the web editor in its Docker image (installer/docker/Dockerfile, target
# editor-web). trunk names the WebAssembly and its script after their hash, so they are
# cached for long; everything else is checked at every visit to find a new build.

# ".br" for a browser that takes Brotli (browsers ask for it over HTTPS only).
map $http_accept_encoding $brotli {
    default "";
    "~*(^|[\s,])br\s*($|[,;])" .br;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The big files have compressed copies from the build of the image (compress.sh):
    # file.gz is sent as it is, file.br by the blocks below; the rest is compressed when
    # it is asked for. Also for HTTP/1.0, which a reverse proxy in front speaks by
    # default (nginx's proxy_pass), and with Vary, so that a cache in between keeps the
    # forms apart.
    gzip_static on;
    gzip on;
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_types application/wasm application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # A block with headers of its own repeats these.
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    # The page with the tags of its public address, robots.txt and sitemap.xml, written
    # from OPENECRAFT_SITE_URL at every start (website-site.sh); / is /index.html.
    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        alias /tmp/openecraft/index.html;
    }
    location = /robots.txt {
        alias /tmp/openecraft/robots.txt;
    }
    location = /sitemap.xml {
        alias /tmp/openecraft/sitemap.xml;
    }

    # The settings of the page (openecraft/config.js: the legal notice of the operator),
    # written from the environment at every start (website-config.sh).
    location = /config.js {
        alias /tmp/openecraft/config.js;
    }

    # The WebAssembly and its script: the Brotli copy for who takes it.
    location ~* -[0-9a-f]+(_bg)?\.(wasm|js)$ {
        if ($brotli) {
            rewrite ^ $uri.br last;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* -[0-9a-f]+(_bg)?\.wasm\.br$ {
        internal;
        gzip off;
        gzip_static off;
        types { }
        default_type application/wasm;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* -[0-9a-f]+(_bg)?\.js\.br$ {
        internal;
        gzip off;
        gzip_static off;
        types { }
        default_type application/javascript;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The license files are not for the index of a search engine; those without an
    # ending are shown, not downloaded.
    location ~ ^/(LICENSE-[A-Z]+|OFL-NotoSans\.txt|THIRD-PARTY-LICENSES\.html)$ {
        default_type text/plain;
        add_header X-Robots-Tag noindex always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri =404;
    }
}
