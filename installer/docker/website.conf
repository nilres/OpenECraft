# nginx site of the OpenECraft website in its Docker image (installer/docker/Dockerfile,
# target website): the page with its live demos at /, the web editor at /editor/. trunk
# names the WebAssembly, its script and the style sheet after their hash, so they are
# cached for long; everything else is checked at every visit to find a new build.
#
# The image starts nginx with this file as a template: ${OPENECRAFT_…} below is replaced
# by the environment variable of that name (docs/website.md), nothing else.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    location ~* -[0-9a-f]+(_bg)?\.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Where the links of the page lead (website/config.js), from the environment.
    location = /config.js {
        default_type application/javascript;
        return 200 'window.OPENECRAFT_SITE = { editor: "${OPENECRAFT_EDITOR_URL}", repository: "${OPENECRAFT_REPOSITORY_URL}", downloads: "${OPENECRAFT_DOWNLOADS_URL}", documentation: "${OPENECRAFT_DOCUMENTATION_URL}", issues: "${OPENECRAFT_ISSUES_URL}" };\n';
    }

    location = /editor {
        return 301 /editor/;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
