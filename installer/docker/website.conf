# nginx site of the OpenECraft website in its Docker image (installer/docker/Dockerfile,
# target website): the page with its live demos at /, the web editor at /editor/. trunk
# names the WebAssembly, its script and the style sheet after their hash, so they are
# cached for long; everything else is checked at every visit to find a new build.
#
# The image starts nginx with this file as a template: a ${OPENECRAFT_…} in it would be
# replaced by the environment variable of that name, nothing else. The settings of the
# page come from the environment through website-config.sh (docs/website.md).

# The log of the visits has no whole address of a visitor: the last part of an IPv4
# address and all but the first three groups of an IPv6 address are left out, so that
# a line names a network and not a person (the privacy notice of the page).
map $remote_addr $visitor {
    ~^(?<network>\d+\.\d+\.\d+)\.\d+$ $network.0;
    ~^(?<network>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*): $network::;
    default 0.0.0.0;
}
log_format visits '$visitor - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# ".br" for a browser that takes Brotli (browsers ask for it over HTTPS only).
map $http_accept_encoding $brotli {
    default "";
    "~*(^|[\s,])br\s*($|[,;])" .br;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log visits;

    # The big files have compressed copies from the build of the image (compress.sh):
    # file.gz is sent as it is, file.br by the blocks below; the rest is compressed when
    # it is asked for. Also for HTTP/1.0, which a reverse proxy in front speaks by
    # default (nginx's proxy_pass), and with Vary, so that a cache in between keeps the
    # forms apart.
    gzip_static on;
    gzip on;
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_types application/wasm application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Not shown inside the pages of other sites, and other sites learn only the host a
    # visitor came from. What the page may load is its own matter (the policy in the
    # head of website/index.html). A block with headers of its own repeats these.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;

    location ~* -[0-9a-f]+\.css$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # The WebAssembly and its script, of the page and of the web editor: the Brotli copy
    # for who takes it.
    location ~* -[0-9a-f]+(_bg)?\.(wasm|js)$ {
        if ($brotli) {
            rewrite ^ $uri.br last;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location ~* -[0-9a-f]+(_bg)?\.wasm\.br$ {
        internal;
        gzip off;
        gzip_static off;
        types { }
        default_type application/wasm;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location ~* -[0-9a-f]+(_bg)?\.js\.br$ {
        internal;
        gzip off;
        gzip_static off;
        types { }
        default_type application/javascript;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # The settings of the page (website/config.js: its links and the legal notice),
    # written from the environment at every start (website-config.sh).
    location = /config.js {
        alias /tmp/openecraft/config.js;
    }

    # The web editor shows the same legal notice (Help > Legal and privacy).
    location = /editor/config.js {
        alias /tmp/openecraft/config.js;
    }

    # The page with the tags of the public address, robots.txt and sitemap.xml, written
    # from OPENECRAFT_SITE_URL at every start (website-site.sh); / is /index.html.
    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        alias /tmp/openecraft/index.html;
    }
    # The page in the other languages (de.html, …), with their tags as well.
    location ~ ^/([a-z][a-z]\.html)$ {
        alias /tmp/openecraft/$1;
    }
    location = /robots.txt {
        alias /tmp/openecraft/robots.txt;
    }
    location = /sitemap.xml {
        alias /tmp/openecraft/sitemap.xml;
    }

    # The license files without an ending are shown, not downloaded.
    location ~ /LICENSE-[A-Z]+$ {
        default_type text/plain;
    }

    location = /editor {
        return 301 /editor/;
    }

    # The pages beside the page (website/src/pages.rs) are folders: their links are
    # relative to it, so /compare goes to /compare/ (relative, as any proxy forwards it).
    location ~ ^/(panel-builders|electricians|education|compare)$ {
        absolute_redirect off;
        return 301 $uri/;
    }
    # With the tags of the public address (website-site.sh), in every language.
    location ~ ^/(panel-builders|electricians|education|compare)/$ {
        alias /tmp/openecraft/$1/index.html;
    }
    location ~ ^/(panel-builders|electricians|education|compare)/((index|[a-z][a-z])\.html)$ {
        alias /tmp/openecraft/$1/$2;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
