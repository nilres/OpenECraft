name: CI

# Also called by release.yml for a tag; tags therefore do not start this workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

# Release builds are reproducible: the Rust version (dtolnay/rust-toolchain@<version>) and
# the versions of cargo-about and trunk are pinned, cargo runs with --locked.
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-${{ matrix.os }}
          path: |
            target/release/openecraft
            target/release/openecraft.exe
            target/release/openecraft-parts-server
            target/release/openecraft-parts-server.exe
            target/release/openecraft-parts-manager
            target/release/openecraft-parts-manager.exe
            target/release/openecraft-project-server
            target/release/openecraft-project-server.exe
            target/release/openecraft-cli
            target/release/openecraft-cli.exe

  # Signed when the secrets WINDOWS_CERTIFICATE (base64 of a .pfx) and
  # WINDOWS_CERTIFICATE_PASSWORD are set (docs/releasing.md).
  windows-installer:
    runs-on: windows-2025
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_SIGN_CERT=$pfx" >> $env:GITHUB_ENV
      - run: powershell -ExecutionPolicy Bypass -File installer\windows\build.ps1
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # The MCP bundle with the program of the setup (installer/mcp/build.py).
      - run: python installer/mcp/build.py bundle --binary target/x86_64-pc-windows-msvc/release/openecraft-cli.exe --notices target/installer/windows/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-windows-installer
          path: |
            target/installer/*.exe
            target/installer/*.mcpb

  # Built on Debian 12, so the binaries run on distributions with glibc 2.36 or newer.
  linux-packages:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config file dpkg-dev rpm \
            libxkbcommon-dev libgtk-3-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            patchelf zsync libxkbcommon-x11-0 libxcursor1 libxi6 python3
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: bash installer/linux/build.sh tar.gz deb rpm appimage
      - run: python3 installer/mcp/build.py bundle --binary target/release/openecraft-cli --notices target/installer/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-linux-packages
          path: |
            target/installer/*.mcpb
            target/installer/*.tar.gz
            target/installer/*.deb
            target/installer/*.rpm
            target/installer/*.AppImage
            target/installer/*.AppImage.zsync
            target/installer/THIRD-PARTY-LICENSES.html

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libxkbcommon-dev libgtk-3-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: bash installer/linux/build.sh flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-flatpak
          path: target/installer/*.flatpak

  # core24 is Ubuntu 24.04, so snapcraft builds on the runner itself.
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          sudo snap install snapcraft --classic
      - run: bash installer/linux/build.sh snap
        env:
          SNAPCRAFT: sudo snapcraft
          SNAPCRAFT_ARGS: --destructive-mode
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-snap
          path: target/installer/*.snap

  # Signed with a Developer ID when the secrets MACOS_CERTIFICATE (base64 of a .p12),
  # MACOS_CERTIFICATE_PASSWORD and MACOS_SIGN_IDENTITY are set, notarized when
  # APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD are set too (docs/releasing.md).
  macos-dmg:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials openecraft --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "MACOS_NOTARY_PROFILE=openecraft" >> "$GITHUB_ENV"
            echo "MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          fi
      - run: bash installer/macos/build.sh
      # The signed universal program of the app.
      - run: python3 installer/mcp/build.py bundle --binary target/installer/macos/dmg/OpenECraft.app/Contents/MacOS/openecraft-cli --notices target/installer/macos/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-macos-dmg
          path: |
            target/installer/*.dmg
            target/installer/*.mcpb

  # Images of the parts and project servers, of the web editor and of the website
  # (installer/docker/Dockerfile), started once to see that they answer. Pushed to GitHub
  # Container Registry on master and for a release tag
  # (ghcr.io/<owner>/openecraft-parts-server, …-project-server, openecraft-web,
  # openecraft-website); every other build only checks them.
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The stars and the contributors of the repository the image of the website starts
      # with; it asks GitHub itself while it runs (installer/docker/website-numbers.sh).
      # Without an answer the image is built without them.
      - name: Stars and contributors of the repository
        id: numbers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          stars=$(gh api "repos/$REPOSITORY" --jq .stargazers_count) || stars=0
          contributors=$(gh api --paginate "repos/$REPOSITORY/contributors?per_page=100&anon=true" --jq '.[].contributions' | wc -l) || contributors=0
          echo "stars=$((stars))" >> "$GITHUB_OUTPUT"
          echo "contributors=$((contributors))" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: parts-server
        with:
          images: ghcr.io/${{ github.repository_owner }}/openecraft-parts-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha
      - uses: docker/metadata-action@v5
        id: project-server
        with:
          images: ghcr.io/${{ github.repository_owner }}/openecraft-project-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha
      - uses: docker/metadata-action@v5
        id: editor-web
        with:
          images: ghcr.io/${{ github.repository_owner }}/openecraft-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha
      - uses: docker/metadata-action@v5
        id: website
        with:
          images: ghcr.io/${{ github.repository_owner }}/openecraft-website
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/docker/Dockerfile
          target: parts-server
          load: true
          tags: openecraft-parts-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/docker/Dockerfile
          target: project-server
          load: true
          tags: openecraft-project-server:ci
          cache-from: type=gha
      # The web build has its own cache: one export per scope keeps the servers' layers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/docker/Dockerfile
          target: editor-web
          load: true
          tags: openecraft-web:ci
          cache-from: type=gha,scope=editor-web
          cache-to: type=gha,scope=editor-web,mode=max
      # The website builds on the stage of the web editor and shares its cache. The days
      # its pages last changed come from pages.tsv of the site that is online: the
      # repository variable OPENECRAFT_SITE_URL (https://…/), else openecraft.org.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/docker/Dockerfile
          target: website
          load: true
          tags: openecraft-website:ci
          build-args: |
            OPENECRAFT_STARS=${{ steps.numbers.outputs.stars }}
            OPENECRAFT_CONTRIBUTORS=${{ steps.numbers.outputs.contributors }}
            OPENECRAFT_PAGES_URL=${{ vars.OPENECRAFT_SITE_URL || 'https://openecraft.org/' }}pages.tsv
          cache-from: |
            type=gha,scope=editor-web
            type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      # The checks keep their downloads out of the checkout: files written into the
      # build context would change the COPY . . of the builds below and miss their cache.
      - name: Start the servers
        run: |
          bash installer/docker/check-server.sh parts openecraft-parts-server:ci
          bash installer/docker/check-server.sh project openecraft-project-server:ci
      - name: Start the web editor
        run: bash installer/docker/check-editor-web.sh openecraft-web:ci
      - name: Start the website
        run: bash installer/docker/check-website.sh openecraft-website:ci
      - uses: docker/build-push-action@v6
        if: env.PUSH == 'true'
        with:
          context: .
          file: installer/docker/Dockerfile
          target: parts-server
          push: true
          tags: ${{ steps.parts-server.outputs.tags }}
          labels: ${{ steps.parts-server.outputs.labels }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        if: env.PUSH == 'true'
        with:
          context: .
          file: installer/docker/Dockerfile
          target: project-server
          push: true
          tags: ${{ steps.project-server.outputs.tags }}
          labels: ${{ steps.project-server.outputs.labels }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        if: env.PUSH == 'true'
        with:
          context: .
          file: installer/docker/Dockerfile
          target: editor-web
          push: true
          tags: ${{ steps.editor-web.outputs.tags }}
          labels: ${{ steps.editor-web.outputs.labels }}
          cache-from: type=gha,scope=editor-web
      - uses: docker/build-push-action@v6
        if: env.PUSH == 'true'
        with:
          context: .
          file: installer/docker/Dockerfile
          target: website
          push: true
          tags: ${{ steps.website.outputs.tags }}
          labels: ${{ steps.website.outputs.labels }}
          build-args: |
            OPENECRAFT_STARS=${{ steps.numbers.outputs.stars }}
            OPENECRAFT_CONTRIBUTORS=${{ steps.numbers.outputs.contributors }}
            OPENECRAFT_PAGES_URL=${{ vars.OPENECRAFT_SITE_URL || 'https://openecraft.org/' }}pages.tsv
          cache-from: |
            type=gha,scope=editor-web
            type=gha,scope=website

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,cargo-about@0.9.3
      - run: cargo clippy -p openecraft -p openecraft-parts-manager -p openecraft-website --target wasm32-unknown-unknown --locked -- -D warnings
      - run: trunk build --release
        working-directory: openecraft
      - run: trunk build --release
        working-directory: parts-manager
      # The screen recording of the website: an asset of the release website-media.
      - run: sh installer/web/tour.sh
      - run: trunk build --release
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-web
          path: openecraft/dist
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-parts-manager-web
          path: parts-manager/dist
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-website
          path: website/dist
