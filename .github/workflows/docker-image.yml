name: Docker image

# Rebuilds one image of installer/docker/Dockerfile alone, without the rest of CI: the
# steps shared by the workflows started by hand (docker-parts-server.yml,
# docker-project-server.yml, docker-web.yml, docker-website.yml), which name the image
# and pass their inputs on. Builds a branch, a release tag or a commit, also one older
# than these workflows, starts the image once and checks it (installer/docker/check-*.sh)
# before it is pushed to ghcr.io/<owner>/<image> with the tags ci.yml gives it:
# sha-<commit>, edge for the tip of master, <version> and <major>.<minor> for a release
# tag (latest for the newest release), and any tags given.
on:
  workflow_call:
    inputs:
      image:
        description: Name of the image (openecraft-web)
        type: string
        required: true
      target:
        description: Stage of the Dockerfile (editor-web)
        type: string
        required: true
      check:
        description: Check script of installer/docker with its arguments; the image is appended
        type: string
        required: true
      cache-from:
        description: Build caches read, those of the job docker of ci.yml
        type: string
        required: true
      cache-to:
        description: Build cache written; empty = none
        type: string
        default: ''
      ref:
        type: string
        default: ''
      tags:
        type: string
        default: ''
      push:
        type: boolean
        default: true
      no-cache:
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # What is built, in src/; the check comes from the workflow's own revision, so an
      # older release without it builds too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: src
          # The tags and master: which image tags the commit gets.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: installer/docker/check-*.sh
          sparse-checkout-cone-mode: false
      - name: Image tags
        id: tags
        working-directory: src
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          EXTRA: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${OWNER,,}/$IMAGE"
          commit=$(git rev-parse HEAD)
          tags=("sha-${commit:0:7}")
          if [ "$commit" = "$(git rev-parse origin/master)" ]; then
            tags+=(edge)
          fi
          release=$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
          if [ -n "$release" ]; then
            version=${release#v}
            tags+=("$version")
            # As docker/metadata-action: a pre-release (1.2.0-rc.1) gets its version only.
            # An older release rebuilt takes <major>.<minor> and latest from no newer one.
            if [[ "$version" != *-* ]]; then
              minor=$(echo "$version" | cut -d. -f1-2)
              releases=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
              if [ "$release" = "$(echo "$releases" | grep -F "v$minor." | tail -n 1)" ]; then
                tags+=("$minor")
              fi
              if [ "$release" = "$(echo "$releases" | tail -n 1)" ]; then
                tags+=(latest)
              fi
            fi
          fi
          for tag in $(echo "$EXTRA" | tr ',' ' '); do
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::'$tag' is no valid image tag"
              exit 1
            fi
            tags+=("$tag")
          done
          {
            echo "list<<EOF"
            for tag in "${tags[@]}"; do echo "$image:$tag"; done
            echo "EOF"
            echo "commit=$commit"
            echo "version=${version:-${commit:0:7}}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $IMAGE of \`$commit\`"
            for tag in "${tags[@]}"; do echo "- \`$image:$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/installer/docker/Dockerfile
          target: ${{ inputs.target }}
          load: true
          tags: ${{ inputs.image }}:ci
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}
      # The script and its arguments are split at the spaces.
      - name: Start the image
        env:
          CHECK: ${{ inputs.check }}
          IMAGE: ${{ inputs.image }}
        run: bash ci/installer/docker/$CHECK "$IMAGE:ci"
      - uses: docker/build-push-action@v6
        if: inputs.push
        with:
          context: src
          file: src/installer/docker/Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.commit }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: ${{ inputs.cache-from }}
