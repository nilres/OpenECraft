name: Website image

# Builds only the Docker image of the website (installer/docker/Dockerfile, target
# website; docs/website.md) from the branch it is started on and pushes it to GitHub
# Container Registry, without the rest of CI: Actions > Website image > Run workflow.
# The image gets the tags edge on master or the name of another branch, sha-<commit>
# and the tag given when starting it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'A further tag of the image, for example latest (optional)'
        required: false
        default: ''
      push:
        description: 'Push the image to ghcr.io (off: only build and check it)'
        type: boolean
        default: true

jobs:
  website:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: website
        with:
          images: ghcr.io/${{ github.repository_owner }}/openecraft-website
          tags: |
            type=edge,branch=master
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      # The caches of the job docker of ci.yml: the website builds on the stage of the
      # web editor.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/docker/Dockerfile
          target: website
          load: true
          tags: openecraft-website:ci
          cache-from: |
            type=gha,scope=editor-web
            type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      # Outside the checkout: files written into the build context would change the
      # COPY . . of the build below and miss its cache.
      - name: Start the website
        working-directory: ${{ runner.temp }}
        run: |
          docker run -d --name site -p 8088:8080 openecraft-website:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8088/ > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8088/ -o site.html || { docker logs site; exit 1; }
          grep -q canvas-schematic site.html
          wasm=$(grep -o '[^"/]*_bg\.wasm' site.html | head -n 1)
          test -n "$wasm"
          curl -fsS http://127.0.0.1:8088/de.html | grep -qF '<html lang="de">'
          for file in "$wasm" config.js site.js sheet.svg apple-touch-icon.png LICENSE-MIT THIRD-PARTY-LICENSES.html routing/index.json editor/; do
            curl -fsS -o /dev/null "http://127.0.0.1:8088/$file"
          done
          # The WebAssembly is sent as the build of the image compressed it.
          curl -fsS -o wasm.gz -D headers.txt -H 'Accept-Encoding: gzip' "http://127.0.0.1:8088/$wasm"
          grep -qi '^content-encoding: gzip' headers.txt
          gzip -t wasm.gz
          docker logs site
          docker stop site
      - uses: docker/build-push-action@v6
        if: inputs.push
        with:
          context: .
          file: installer/docker/Dockerfile
          target: website
          push: true
          tags: ${{ steps.website.outputs.tags }}
          labels: ${{ steps.website.outputs.labels }}
          cache-from: |
            type=gha,scope=editor-web
            type=gha,scope=website
      - name: Summary
        run: |
          {
            echo '### Website image'
            echo
            echo 'Pushed: ${{ inputs.push }}'
            echo
            echo '```'
            echo '${{ steps.website.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
