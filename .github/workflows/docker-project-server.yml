name: Docker image of the project server

# Rebuilds only the image of the project server (installer/docker/Dockerfile, target
# project-server), started by hand (Actions › Docker image of the project server › Run
# workflow): of a branch, a release tag or a commit, also of one older than this
# workflow. The image is started once and checked (installer/docker/check-server.sh)
# before it is pushed to ghcr.io/<owner>/openecraft-project-server with the tags ci.yml
# gives it and any tags given (docker-image.yml).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag (v0.1.2) or commit to build; empty = the branch the workflow runs on
        required: false
        default: ''
      tags:
        description: Further tags of the image, separated by spaces or commas (e.g. test)
        required: false
        default: ''
      push:
        description: Push the image to the GitHub Container Registry (off = build and check only)
        type: boolean
        default: true
      no-cache:
        description: Build every layer anew (no build cache)
        type: boolean
        default: false

# One rebuild at a time: a later one waits instead of pushing the same tags in between.
concurrency:
  group: docker-project-server
  cancel-in-progress: false

jobs:
  project-server:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: openecraft-project-server
      target: project-server
      check: check-server.sh project
      # The cache of the servers is the one of ci.yml, which the image of the parts
      # server writes: both are built by the same stage.
      cache-from: type=gha
      ref: ${{ inputs.ref }}
      tags: ${{ inputs.tags }}
      push: ${{ inputs.push }}
      no-cache: ${{ inputs.no-cache }}
