name: Docker image of the web editor

# Rebuilds only the image of the web editor (installer/docker/Dockerfile, target
# editor-web), started by hand (Actions › Docker image of the web editor › Run workflow):
# of a branch, a release tag or a commit, also of one older than this workflow. The image
# is started once and checked (installer/docker/check-editor-web.sh) before it is pushed
# to ghcr.io/<owner>/openecraft-web with the tags ci.yml gives it: sha-<commit>, edge for
# the tip of master, <version> and <major>.<minor> for a release tag (latest for the
# newest release), and any tags given.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag (v0.1.2) or commit to build; empty = the branch the workflow runs on
        required: false
        default: ''
      tags:
        description: Further tags of the image, separated by spaces or commas (e.g. test)
        required: false
        default: ''
      push:
        description: Push the image to the GitHub Container Registry (off = build and check only)
        type: boolean
        default: true
      no-cache:
        description: Build every layer anew (no build cache)
        type: boolean
        default: false

# One rebuild at a time: a later one waits instead of pushing the same tags in between.
concurrency:
  group: docker-web
  cancel-in-progress: false

jobs:
  editor-web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # What is built, in src/; the check comes from the workflow's own revision, so an
      # older release without it builds too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: src
          # The tags and master: which image tags the commit gets.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: installer/docker/check-editor-web.sh
          sparse-checkout-cone-mode: false
      - name: Image tags
        id: tags
        working-directory: src
        env:
          OWNER: ${{ github.repository_owner }}
          EXTRA: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${OWNER,,}/openecraft-web"
          commit=$(git rev-parse HEAD)
          tags=("sha-${commit:0:7}")
          if [ "$commit" = "$(git rev-parse origin/master)" ]; then
            tags+=(edge)
          fi
          release=$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
          if [ -n "$release" ]; then
            version=${release#v}
            tags+=("$version")
            # As docker/metadata-action: a pre-release (1.2.0-rc.1) gets its version only.
            # An older release rebuilt takes <major>.<minor> and latest from no newer one.
            if [[ "$version" != *-* ]]; then
              minor=$(echo "$version" | cut -d. -f1-2)
              releases=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
              if [ "$release" = "$(echo "$releases" | grep -F "v$minor." | tail -n 1)" ]; then
                tags+=("$minor")
              fi
              if [ "$release" = "$(echo "$releases" | tail -n 1)" ]; then
                tags+=(latest)
              fi
            fi
          fi
          for tag in $(echo "$EXTRA" | tr ',' ' '); do
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::'$tag' is no valid image tag"
              exit 1
            fi
            tags+=("$tag")
          done
          {
            echo "list<<EOF"
            for tag in "${tags[@]}"; do echo "$image:$tag"; done
            echo "EOF"
            echo "commit=$commit"
            echo "version=${version:-${commit:0:7}}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### openecraft-web of \`$commit\`"
            for tag in "${tags[@]}"; do echo "- \`$image:$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The cache of the web build is the one of ci.yml (scope editor-web).
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/installer/docker/Dockerfile
          target: editor-web
          load: true
          tags: openecraft-web:ci
          no-cache: ${{ inputs.no-cache }}
          cache-from: type=gha,scope=editor-web
          cache-to: type=gha,scope=editor-web,mode=max
      - name: Start the web editor
        run: bash ci/installer/docker/check-editor-web.sh openecraft-web:ci 8080
      - uses: docker/build-push-action@v6
        if: inputs.push
        with:
          context: src
          file: src/installer/docker/Dockerfile
          target: editor-web
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=openecraft-web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.commit }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha,scope=editor-web
