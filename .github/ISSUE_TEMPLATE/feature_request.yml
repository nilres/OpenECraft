name: Feature request
description: Something OpenECraft should do that it does not do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [open issues](https://github.com/nilres/OpenECraft/issues) and the [documentation](https://github.com/nilres/OpenECraft#documentation) first; one feature per issue.
  - type: textarea
    id: task
    attributes:
      label: What do you want to get done?
      description: The task in your daily work, not only the button you are missing. Who does it, and how often?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of the workflow in OpenECraft. Where would you look for it (ribbon, pane, report, command)?
  - type: textarea
    id: elsewhere
    attributes:
      label: How do other tools do it?
      description: EPLAN, AutoCAD Electrical, SEE Electrical, QElectroTech or others; standards (IEC 81346, IEC 60617, …) that apply. Screenshots welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Schematics and symbols
        - Reports and checks
        - Parts and data portal
        - Panel layout and 3D
        - Wiring and workshop
        - Calculations
        - Import and export
        - Teams, project server
        - Command line, MCP, plugins
        - Web editor
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I could help build or test this.
