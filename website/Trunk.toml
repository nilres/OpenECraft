[build]
target = "index.html"
dist = "dist"
# Relative addresses: the page works in any folder of a web server.
public_url = "./"
# The page shows itself first and loads the module (40 MB) afterwards: trunk only
# names the module and the WebAssembly, site.js loads them (docs/website.md).
pattern_script = "<script>window.OPENECRAFT_MODULE = [\"{base}{js}\", \"{base}{wasm}\"];</script>"
pattern_preload = "<!-- the module is loaded by site.js -->"

[serve]
addresses = ["127.0.0.1"]
port = 8084

# License files next to the page (installer/web/licenses.sh).
[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = ["../installer/web/licenses.sh"]

[hooks.windows]
command = "powershell"
command_arguments = ["-ExecutionPolicy", "Bypass", "-File", "..\\installer\\web\\licenses.ps1"]

# The 3D routings of the examples beside the page (routing/, docs/website.md): an
# example is there at once instead of after a search in the browser. Release builds only.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--release", "-p", "openecraft-core", "--example", "routings"]

# The page in every language beside the English one (de.html, …), for search engines
# (docs/website.md).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--release", "-p", "openecraft-i18n", "--example", "pages"]

# The pages beside it (compare/, panel-builders/, …) in every language as well.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["pages.sh"]

[hooks.windows]
command = "powershell"
command_arguments = ["-ExecutionPolicy", "Bypass", "-File", "pages.ps1"]

# The pages the build writes (crates/openecraft-site, docs/website.md): the symbol
# library, the example projects, the documentation, the news with their feed and the
# pages of content/, each in its languages, and build.js.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--release", "-p", "openecraft-site", "--example", "site"]
