[package]
name = "openecraft-website"
version.workspace = true
edition = "2021"
description = "The OpenECraft website: a presentation of the project with live demos that run the editor's own views, checks, reports, commands and exports in the browser"
license = "MIT OR Apache-2.0"

[[bin]]
name = "openecraft-website"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde_json = "1"
log = "0.4"
openecraft-api = { path = "../crates/openecraft-api" }
openecraft-canvas = { path = "../crates/openecraft-canvas" }
openecraft-core = { path = "../crates/openecraft-core" }
openecraft-i18n = { path = "../crates/openecraft-i18n" }
openecraft-session = { path = "../crates/openecraft-session" }
openecraft-shell = { path = "../crates/openecraft-shell" }
openecraft-ui = { path = "../crates/openecraft-ui" }
openecraft-view = { path = "../crates/openecraft-view" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }
