[package]
name = "openecraft-cli"
version.workspace = true
edition = "2021"
description = "OpenECraft command line and MCP server - edits projects and maintains the parts server without a window"
license = "MIT OR Apache-2.0"

[[bin]]
name = "openecraft-cli"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = "1"
openecraft-client = { path = "../crates/openecraft-client" }
openecraft-api = { path = "../crates/openecraft-api" }
openecraft-core = { path = "../crates/openecraft-core" }
openecraft-edz = { path = "../crates/openecraft-edz" }
openecraft-scan = { path = "../crates/openecraft-scan" }
openecraft-parts = { path = "../crates/openecraft-parts" }
openecraft-i18n = { path = "../crates/openecraft-i18n" }

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
