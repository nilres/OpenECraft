<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenECraft data portal</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web.css">
<style>
#search-form { display: flex; gap: 6px; flex: 1 1 320px; }
#search-form input { flex: 1; min-width: 0; }
main { display: grid; grid-template-columns: 270px 1fr; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
main:has(#facets:empty) { grid-template-columns: 1fr; }
#facets:empty { display: none; }
.facet ul { list-style: none; margin: 0; padding: 0; }
.facet li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
.facet li:hover { background: var(--chip); }
.facet li.sel { background: var(--chip); font-weight: 600; }
.facet .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.facet .more { color: var(--accent); cursor: pointer; font-size: 13px; padding: 2px 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { background: var(--chip); border-radius: 12px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
.badge.PhaseOut { color: var(--warn); }
.badge.Discontinued { color: var(--bad); }
.badge.Active { color: var(--ok); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; }
.detail h2 { margin: 0 0 4px; font-size: 22px; }
.detail .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.images img { max-width: 220px; max-height: 160px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.graphics { display: flex; flex-wrap: wrap; gap: 14px; }
.graphics figure { margin: 0; flex: 1 1 300px; max-width: 520px; }
.graphics figcaption { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.graphics svg, .graphics canvas { display: block; width: 100%; height: 280px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.graphics canvas { cursor: grab; touch-action: none; }
.graphics svg * { vector-effect: non-scaling-stroke; fill: none; stroke: var(--text); stroke-width: 1.2; }
.graphics svg .fill { fill: var(--text); }
.graphics svg text { fill: var(--text); stroke: none; }
.with-logo { display: flex; gap: 12px; align-items: center; }
/* On white, which the logos are made for (also in the dark theme). */
.logo-small, .logo-medium, .logo-large { display: block; object-fit: contain; flex: none; border-radius: 4px; background: #fff; padding: 3px; }
.logo-small { height: 24px; max-width: 80px; }
.logo-medium { height: 48px; max-width: 160px; }
.logo-large { height: 56px; max-width: 100%; }
.card-logo { margin-bottom: 8px; }
/* Dashboard */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.tile .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .label { color: var(--muted); font-size: 13px; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; }
.chart { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 12px; min-width: 0; }
.chart.wide { grid-column: 1 / -1; }
.chart h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.hbars { display: grid; grid-template-columns: minmax(70px, max-content) minmax(60px, 1fr) max-content; gap: 6px 10px; align-items: center; font-size: 13px; }
.hbars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.hbars .track { height: 14px; position: relative; }
.hbars .bar { height: 100%; background: var(--viz-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbars .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.hbars .row { display: contents; cursor: default; }
.hbars .row:hover .bar { filter: brightness(1.15); }
.hbars .row:hover .name { color: var(--accent); }
.hbars a.name { color: var(--text); }
.segments { display: flex; gap: 2px; height: 22px; margin: 4px 0 10px; }
.segments div { border-radius: 4px; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.columns { display: flex; gap: 4px; align-items: flex-end; height: 160px; border-bottom: 1px solid var(--line); padding-top: 18px; }
.columns .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.columns .col:hover .bar { filter: brightness(1.15); }
.columns .bar { width: 70%; max-width: 36px; background: var(--viz-1); border-radius: 4px 4px 0 0; }
.columns .top { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.months { display: flex; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.months span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
#viz-tip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.star { font-size: 18px; line-height: 1; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; padding: 12px 16px; }
  /* The results come first, the filters below them. */
  #facets { order: 2; }
}
</style>
</head>
<body data-title="OpenECraft data portal">
<header>
  <h1><a href="#" id="home"><img src="/logo.svg" alt=""><span data-t="OpenECraft data portal">OpenECraft data portal</span></a></h1>
  <form id="search-form">
    <input id="q" type="search" autocomplete="off" data-tp="Search parts">
    <button class="primary" data-t="Search">Search</button>
  </form>
  <nav>
    <button id="nav-dashboard" data-t="Dashboard" hidden>Dashboard</button>
    <button id="nav-parts" class="active" data-t="All parts">All parts</button>
    <button id="nav-favorites" data-t="Favorites">Favorites</button>
    <button id="nav-catalogs" data-t="Catalogs">Catalogs</button>
    <button id="nav-admin" data-t="Administration" hidden>Administration</button>
    <select id="lang" aria-label="Language"></select>
  </nav>
  <div id="account"></div>
</header>
<main>
  <aside id="facets"></aside>
  <section class="panel" id="content"><div class="status" data-t="Loading…">Loading…</div></section>
</main>
<footer id="footer"></footer>
<div id="viz-tip" hidden></div>
<script src="/common.js"></script>
<script src="/access.js"></script>
<script src="/admin.js"></script>
<script src="/edit.js"></script>
<script src="/dashboard.js"></script>
<script src="/portal.js"></script>
</body>
</html>
