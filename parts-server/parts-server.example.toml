# Configuration of the OpenECraft parts server:
#   openecraft-parts-server --config parts-server.toml
# or OPENECRAFT_PARTS_SERVER_CONFIG=parts-server.toml. Every setting is optional and has
# the name of its command line option (`admin_user` for `--admin-user`); options on the
# command line or in the environment win. Relative paths are relative to this file.

# Address to listen on.
bind = "0.0.0.0:8090"

# Database file; created with the example and the bundled catalogs if missing.
data = "parts-db.sqlite"

# Storage backend: "sqlite" or "json". Default: from the extension of the data file.
# storage = "sqlite"

# Administrator token. Better kept out of this file: OPENECRAFT_TOKEN.
# token = "change-me"

# Administrator account created (or reset) at startup (or OPENECRAFT_ADMIN_USER); its
# password is read from OPENECRAFT_ADMIN_PASSWORD.
# admin_user = "admin"

# Bundled manufacturer catalogs installed or updated at startup: ["all"] or ids.
# install_catalogs = ["siemens", "phoenix_contact"]

# Access settings (directories, roles, grants). Default: <data>.access.json.
# access = "parts-db.access.json"

# Users may register themselves as readers on the web page (or OPENECRAFT_REGISTRATION,
# --registration true|false). Without it, administrators switch it on the web page
# (Administration > Access rights).
# registration = true

# The dashboard (graphs of the parts) on the web page: true or false (or
# OPENECRAFT_DASHBOARD, --dashboard true|false). Without it, administrators switch it on
# the web page (Administration > Overview); it is shown by default.
# dashboard = false

# The legal notice of who runs the server, shown by the web page (in Germany the
# Impressum): a link "Legal notice" below the page when a name is set. Lines of the
# address and of the texts are separated by "|". Each field is also set by a variable:
# OPENECRAFT_LEGAL_NAME, _ADDRESS, _EMAIL, _PHONE, _REPRESENTATIVE, _REGISTER, _VAT_ID,
# _RESPONSIBLE, _TEXT, _PRIVACY (a variable wins over this file).
# [legal]
# name = "ACME Automation GmbH"
# address = "Example Street 1 | 12345 Example City | Germany"
# email = "info@example.com"
# phone = "+49 123 456789"
# representative = "Jane Doe"
# register = "Amtsgericht Example, HRB 12345"
# vat = "DE123456789"
# responsible = "Jane Doe, address as above"
# Further text: disclaimers, dispute resolution.
# text = "We are not obliged to take part in dispute resolution proceedings."
# Added to the privacy notice of the page: the hosting, the logs, whom to ask.
# privacy = "Hosted by Example Hosting GmbH. | Questions: privacy@example.com"
