[package]
name = "openecraft-parts-server"
version.workspace = true
edition = "2021"
description = "Global parts database server for OpenECraft"
license = "MIT OR Apache-2.0"

[[bin]]
name = "openecraft-parts-server"
path = "src/main.rs"

[dependencies]
openecraft-parts = { path = "../crates/openecraft-parts" }
openecraft-i18n = { path = "../crates/openecraft-i18n" }
axum = "0.8"
openecraft-auth = { path = "../crates/openecraft-auth" }
openecraft-web = { path = "../crates/openecraft-web" }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
